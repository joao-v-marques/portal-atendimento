server:
  servlet:
    context-path: /portal-atendimento

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION:86400000}
  security:
    # em produção defina COOKIE_SECURE=true (exige HTTPS)
    cookie-secure: ${COOKIE_SECURE:false}
  storage:
    documents-root: ${DOCUMENTS_ROOT:./uploads/documents}
    max-files-per-request: 10

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/portal_atendimento}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:1234}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  application:
    name: portal-atendimento
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB