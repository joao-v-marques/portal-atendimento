services:
  app:
    build: .
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?defina POSTGRES_DB no .env}
      DB_USERNAME: ${POSTGRES_USER:?defina POSTGRES_USER no .env}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env}
      COOKIE_SECURE: "false"
      DOCUMENTS_ROOT: /data/documents
      TZ: America/Sao_Paulo
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75
    volumes:
      - /srv/portal-atendimento/data/documents:/data/documents
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: America/Sao_Paulo
    volumes:
      - /srv/portal-atendimento/data/pgdata:/var/lib/postgresql
    stop_grace_period: 1m
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /srv/portal-atendimento/data/caddy:/data
    depends_on:
      - app
